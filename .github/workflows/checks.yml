name: checks

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # The runner images already have the .NET 10 SDK, so nothing is downloaded.
      - name: Test web logic
        run: node --test tests/*.test.cjs
      - name: Test desktop services
        run: dotnet run --project tests/shell -c Release